<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f8f9fa;
        }
        
        .review-container {
    max-width: 500px;
    margin: 0 auto;
    padding: 0;
    background-color: white;
    border-radius: 4px;
}
        
        h5.text-center.h5 {
    font-family: Poppins;
    font-size: 23px;
    font-weight: 600;
    line-height: 34.5px;
    text-align: center;
    color: #000000;
    margin-top: 45px;
}

p.text-center.para {
    font-family: Poppins;
    font-size: 14px;
    font-weight: 400;
    line-height: 21px;
    text-align: center;
    color: #454545;
    margin-top: 23px;
}

  .btn-post {
    background-color: #0957DF;
    color: #FFFFFF;
    border: none;
    padding: 11px 25px;
    font-family: Poppins;
    font-size: 16px;
    font-weight: 400;
    line-height: 25.5px;
    text-align: center;
    height: 44px;
    margin-bottom: 15px;
    margin-top: 40px;
}
       
       .btn-post:hover {
    color: #ffff !important;
    background-color: #0957DF !important;
    border-color: unset !important;
}

     .btn-post:active {
    color: #ffff !important;
    background-color: #0957DF !important;
    border-color: unset !important;
}
.review-sec {
    margin-left: 20px;
    margin-right: 10px;
}

img.thankyou {
    width: 100%;
    margin-top: 16px;
}

    </style>
</head>
<body>
    <div class="review-container">
    <img src="/images/thanku.png" alt="Sri Ramakrishna Hospital" class="thankyou">
     <div class="review-sec">
    <h5 class="text-center h5">Thank You for your response!</h5>
    <p class="text-center para">Your feedback is valuable to us, and we<br>appreciate the opportunity to make things better.</p>
<button type="button" class="btn btn-post w-100" onclick="window.location.href='https://review.brightbridgeinfotech.com';">Close</button>
    </div>
</div>
<!-- Bootstrap JS and Font Awesome Icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
