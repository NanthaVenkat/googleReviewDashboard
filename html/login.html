<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Nunito Sans", sans-serif;
            background-color: #f8f9fa;
        }
        
  .review-sec {
    background: #fff;
    border-radius: 50px 50px 0px 0px;
    margin-top: -92px;
    z-index: 9999;
    position: relative;
}
        
       p.text-center {
    font-family: Nunito Sans;
    font-size: 15px;
    font-weight: 400;
    line-height: 24px;
    text-align: center;
    color: #888888;
}
        
   h3.text-center {
    font-family: Nunito Sans;
    font-size: 32px;
    font-weight: 700;
    line-height: 42px;
    text-align: center;
    color: #121212;
}
        .review-container {
            max-width: 500px;
            margin: 0 auto;
            padding:0;
            background-color: white;
            border-radius: 4px;
        }
       
        .hospital-logo {
            display: block;
            margin-left: auto;
            margin-right: auto;
             padding-top: 40px;
           padding-bottom: 20px;
        }
      
        
       .btn-post {
    background-color: #0957DF;
    color: #FFFFFF;
    border: none;
    padding: 11px 25px;
    font-family: Poppins;
    font-size: 16px;
    font-weight: 400;
    line-height: 25.5px;
    text-align: center;
    height: 44px;
    margin-bottom: 15px;
    margin-top: 27px;
}
       
       .btn-post:hover {
    color: #ffff !important;
    background-color: #0957DF !important;
    border-color: unset !important;
}

     .btn-post:active {
    color: #ffff !important;
    background-color: #0957DF !important;
    border-color: unset !important;
}


::placeholder {
    font-family: Poppins;
font-size: 12px;
font-weight: 400;
line-height: 16.5px;
text-align: left;
color:#A9A9A9;
}

        .form-control {
    padding: 12px 45px 12px 32px;
    margin-bottom: 6px;
    font-size: 12px;
    border: unset;
}

        .form-group {
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            color: #888888;
        }

        /* Button styles */
        .btn-login {
            background-color: #775DA6;
    color: white;
    border-radius: 8px;
    padding: 12px;
    width: 92%;
    border: none;
    margin-left: 20px;
    font-family: Montserrat;
    font-size: 16px;
    font-weight: 600;
    line-height: 19.5px;
    letter-spacing: -0.30000001192092896px;
    text-align: center;
        }

        .btn-login:hover {
            background-color: unset !important;
        }

        /* Forgot Password */
        .forgot-password {
            color: #888888;
            text-decoration: none;
            display: block;
            text-align: right;
            font-size: 12px;
            margin-bottom: 20px;
            margin-right: 19px;
            line-height:18px;
        }

        .forgot-password:hover {
            color: #7b61ff;
        }
        
        
        .form-group-one {
    margin: 16px;
    border: 1px solid #0000001A;
    padding: 16px 16px 5px 16px;
    border-radius: 12px;
}

input.form-control.as {
    border-bottom: 1px solid #0000001A;
    border-radius: 0;
}

::placeholder {
    font-family: "Nunito Sans", sans-serif;;
font-size: 12px;
font-weight: 400;
line-height: 20px;
text-align: left;
color: #2626268F;
}

.form-control:focus {
    color: unset !important;
    background-color: unset !important;
    border-color: unset !important;
    outline: 0 !important;
    box-shadow: unset !important;
}

<body>

<div class="review-container">
    
        <img src="/images/reviewlogin.svg" alt="Sri Ramakrishna Hospital">
     <div class="review-sec">
         <div class="review-header">
           <img src="/images/reviewdashboardlogo.svg" alt="Hospital Logo" class="hospital-logo">
        </div>
    <h3 class="text-center">Welcome Back</h3>
    <p class="text-center">Hello, please login to enjoy all the features further</p>
                <form>
           <div class="form-group-one">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-control as" placeholder="Username">
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-control" placeholder="Password">
                </div>
                </div>
                <a href="#" class="forgot-password">Forgot Password?</a>
                <button type="submit" class="btn btn-login">Login</button>
            </form>

  </div>  
</div>

<!-- Bootstrap JS and Font Awesome Icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
