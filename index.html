<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f8f9fa;
        }

        textarea#comments {
            height: 99px;
            padding-top: 15px;
            padding-left: 13px;
        }

        .form-control {
            border-radius: 3px;
            border: 1px solid #D9D9D9;
            height: 45px;
        }

        .form-label {
            font-weight: 600;
            font-family: Poppins;
            font-size: 14px;
            line-height: 19.5px;
            text-align: left;
            color: #121212;
        }

        form#review-form {
            margin-left: 25px;
            margin-right: 25px;
        }

        p.text-center {
            font-family: Poppins;
            font-size: 14px;
            font-weight: 400;
            line-height: 19.5px;
            text-align: center;
            color: #454545;
            margin-top: 22px;
            margin-bottom: 23px;
        }

        h3.text-center {
            font-family: Poppins;
            font-size: 18px;
            font-weight: 600;
            line-height: 27px;
            margin-top: 22px;
            margin-bottom: 15px;
        }

        .review-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0;
            background-color: white;
            border-radius: 4px;
        }

        .review-header img {
            width: 100%;
            height: auto;
        }

        .hospital-logo {
            display: block;
            margin-top: -33px;
            width: 50px !important;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 20px;
        }

        .star-rating {
            text-align: center;
            margin-bottom: 10px;
        }

        .star-rating i {
            font-size: 25px;
            color: #D9D9D9;
            cursor: pointer;
            padding: 5px;
        }

        .btn-post {
            background-color: #0957DF;
            color: #FFFFFF;
            border: none;
            padding: 11px 25px;
            font-family: Poppins;
            font-size: 16px;
            font-weight: 400;
            line-height: 25.5px;
            text-align: center;
            height: 44px;
            margin-bottom: 15px;
            margin-top: 27px;
        }

        .btn-post:hover {
            color: #ffff !important;
            background-color: #0957DF !important;
            border-color: unset !important;
        }

        .btn-post:active {
            color: #ffff !important;
            background-color: #0957DF !important;
            border-color: unset !important;
        }

        .add-photo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px;
            border-radius: 3px;
            border: 1px solid #D9D9D9;
        }

        .add-photo i {
            color: #007bff;
        }

        /* Hide default file input */
        input[type="file"] {
            display: none;
        }

        /* Add Photos Section with Custom Image */
        .add-photo img.custom-icon {
            width: 20px;
            margin-right: 10px;
        }

        /* Active star color */
        .star-rating .active {
            color: #ffc107;
        }

        /* Style for photo preview */
        .photo-preview img {
            max-width: 100px;
            margin: 5px;
        }

        /* Style for validation errors */
        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        label.form-label.photo {
            margin-bottom: -4px;
            height: 31px;
            margin-top: 10px;
            font-weight: 300;
            padding-left: 5px;
        }

        img.Camera {
            width: 18px;
            height: 18px;
        }

        ::placeholder {
            font-family: Poppins;
            font-size: 12px;
            font-weight: 400;
            line-height: 16.5px;
            text-align: left;
            color: #A9A9A9;
        }

        .bbit-link {
            text-decoration: none;
            font-weight: 600;
            color: #14B3DB;
        }

        footer p {
            border-top: 2px solid #D9D9D9;
        }
    </style>
</head>

<body>

    <div class="review-container">
        <div class="review-header">
            <img src="./img/review-img-new.png" alt="Sri Ramakrishna Hospital">
            <img src="./img/logonewa.svg" alt="Hospital Logo" class="hospital-logo">
        </div>
        <h3 class="text-center">Sri Ramakrishna Hospital</h3>
        <div class="star-rating">
            <!-- Stars for rating -->
            <i class="fas fa-star" data-value="1"></i>
            <i class="fas fa-star" data-value="2"></i>
            <i class="fas fa-star" data-value="3"></i>
            <i class="fas fa-star" data-value="4"></i>
            <i class="fas fa-star" data-value="5"></i>
        </div>
        <p class="text-center">Tell us about your experience with<br>Sri Ramakrishna Hospital, Coimbatore.</p>

        <form id="review-form">
            <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your name">
                <div class="error" id="nameError">Please enter your name.</div>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Your Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
                <div class="error" id="phoneError">Please enter your phone number.</div>
            </div>
            <div class="mb-3">
                <label for="comments" class="form-label">Comments</label>
                <textarea class="form-control" id="comments" rows="3"
                    placeholder="Share details of your own experience at this place"></textarea>
                <div class="error" id="commentsError">Please enter your comments.</div>
            </div>
            <div class="mb-3 add-photo">
                <label for="photo" class="form-label photo">
                    <img src="./img/Vectorcamera.svg" alt="Camera" class="Camera">
                    Add Photos
                </label>
                <i class="fas fa-plus-circle" id="add-photo-btn"></i>
                <input type="file" id="photo" accept="image/*" multiple>
            </div>
            <div id="photo-preview" class="photo-preview"></div>
            <button type="submit" class="btn btn-post w-100">Post Review</button>
        </form>
    </div>

    <footer>
        <p class="text-center mx-5 pt-3">© 2024, All Rights Reserved. Developed by <a class="bbit-link" target="_blank"
                href="http://brightbridge.co/">Bright Bridge</a></p>
    </footer>

    <!-- Bootstrap JS and Font Awesome Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript to handle star rating clicks
        const stars = document.querySelectorAll('.star-rating i');

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                // Remove 'active' class from all stars
                stars.forEach(s => s.classList.remove('active'));

                // Add 'active' class to clicked star and all preceding stars
                for (let i = 0; i <= index; i++) {
                    stars[i].classList.add('active');
                }
            });
        });

        // JavaScript to handle photo upload and preview
        const photoInput = document.getElementById('photo');
        const photoPreview = document.getElementById('photo-preview');
        const addPhotoBtn = document.getElementById('add-photo-btn');

        addPhotoBtn.addEventListener('click', () => {
            photoInput.click(); // Trigger the hidden file input when clicking the "+" icon
        });

        photoInput.addEventListener('change', (event) => {
            photoPreview.innerHTML = ''; // Clear previous preview
            const files = event.target.files;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    photoPreview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        // Validation logic
        const form = document.getElementById('review-form');
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const commentsInput = document.getElementById('comments');
        const nameError = document.getElementById('nameError');
        const phoneError = document.getElementById('phoneError');
        const commentsError = document.getElementById('commentsError');

        form.addEventListener('submit', function (event) {
            let isValid = true;

            // Reset error states
            nameError.style.display = 'none';
            phoneError.style.display = 'none';
            commentsError.style.display = 'none';

            // Name validation
            if (nameInput.value.trim() === '') {
                nameError.style.display = 'block';
                isValid = false;
            }

            // Phone number validation
            if (phoneInput.value.trim() === '') {
                phoneError.style.display = 'block';
                isValid = false;
            }

            // Comments validation
            if (commentsInput.value.trim() === '') {
                commentsError.style.display = 'block';
                isValid = false;
            }

            // If form is valid, redirect to thank you page
            if (isValid) {
                event.preventDefault(); // Prevent actual form submission
                window.location.href = 'https://review.brightbridgeinfotech.com/thankyou.html'; // Redirect to Thank You page
            } else {
                event.preventDefault(); // Prevent submission if form is not valid
            }
        });
    </script>

</body>

</html>
