<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #F3F4F9;
    }
    .dashboard {
      padding: 20px;
    }
    .menu-icon, .search-icon {
      font-size: 24px;
      cursor: pointer;
      color: #fff;
    }
    .navbar {
      background-color: #6D48E5;
      padding: 15px;
    }
    .menu-wrapper {
      background-color: white;
      height: 100vh;
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      z-index: 100;
      transition: 0.4s;
    }
    .menu-wrapper.active {
      left: 0;
    }
    .menu-header {
      background-color: #6D48E5;
      padding: 20px;
      text-align: center;
      color: white;
    }
    .menu-links a {
      text-decoration: none;
      display: block;
      padding: 10px;
      color: #6D48E5;
    }
    .badge-counter {
      background-color: #EEE;
      font-size: 14px;
      color: #6D48E5;
      padding: 5px 15px;
      border-radius: 50px;
    }
    .card {
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }
    .pie-chart {
      width: 250px;
      height: 250px;
      margin: 0 auto;
    }
    .filter-buttons {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .filter-buttons button {
      background: #EEE;
      color: #6D48E5;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      border-radius: 10px;
    }
    .filter-buttons button:hover {
      background: #6D48E5;
      color: white;
    }
    .carousel-inner {
      align-items: center;
    }
    .user-carousel .carousel-item {
      display: flex;
      justify-content: space-around;
    }
    .user-carousel img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .user-carousel p {
      margin-top: 5px;
      font-size: 14px;
      text-align: center;
    }
    .carousel-control-prev-icon, .carousel-control-next-icon {
      background-color: #6D48E5;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar d-flex justify-content-between">
    <i class="fas fa-bars menu-icon" id="menuIcon"></i>
    <h4 class="text-white">Dashboard</h4>
    <i class="fas fa-search search-icon"></i>
  </div>

  <!-- Sidebar Menu -->
  <div class="menu-wrapper" id="sidebarMenu">
    <div class="menu-header">
      <h5>Mr. Lorem Ipsum</h5>
      <p>Admin</p>
    </div>
    <div class="menu-links">
      <a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="#"><i class="fas fa-star"></i> Bad Reviews</a>
      <a href="#"><i class="fas fa-sign-out-alt"></i> Log Out</a>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div class="dashboard container">
    
    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button>All</button>
      <button>Today</button>
      <button>Yesterday</button>
      <button>Custom Date</button>
    </div>

    <!-- Total Bad Reviews -->
    <div class="card text-center p-4">
      <h5>Total Bad Reviews</h5>
      <h2>35</h2>
      <button class="btn btn-link text-right">See All <i class="fas fa-arrow-right"></i></button>
    </div>

    <!-- Carousel for Recent Users -->
    <div id="userCarousel" class="carousel slide user-carousel mb-4" data-ride="carousel" data-interval="false">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <div class="text-center">
            <img src="your_photo.png" alt="Steve">
            <p>Steve</p>
          </div>
          <div class="text-center">
            <img src="your_photo.png" alt="Ahmed">
            <p>Ahmed</p>
          </div>
          <div class="text-center">
            <img src="your_photo.png" alt="Priya">
            <p>Priya</p>
          </div>
          <div class="text-center">
            <img src="your_photo.png" alt="Jayashree">
            <p>Jayashree</p>
          </div>
        </div>
        <div class="carousel-item">
          <div class="text-center">
            <img src="your_photo.png" alt="Lalitha">
            <p>Lalitha</p>
          </div>
          <div class="text-center">
            <img src="your_photo.png" alt="Haris">
            <p>Haris</p>
          </div>
          <!-- Add more users as needed -->
        </div>
      </div>
      <a class="carousel-control-prev" href="#userCarousel" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#userCarousel" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>

    <!-- Pie Chart -->
    <div class="card text-center p-4">
      <h5>Bad Reviews</h5>
      <div class="pie-chart">
        <!-- Pie chart code should be here -->
        <canvas id="myPieChart"></canvas>
      </div>
      <button class="btn btn-link">View All</button>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script>
    $(document).ready(function() {
      $('#menuIcon').click(function() {
        $('#sidebarMenu').toggleClass('active');
      });

      // Pie chart
      var ctx = document.getElementById('myPieChart').getContext('2d');
      var myPieChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['1 Star', '2 Star', '3 Star', '4 Star', '5 Star'],
          datasets: [{
            data: [19, 19, 3, 5, 2],
            backgroundColor: ['#ff6384', '#36a2eb', '#ffcd56', '#4bc0c0', '#9966ff']
          }]
        }
      });
    });
  </script>

</body>
</html>
